; ============================================================================
; Full feature example. Place in $MapperConfigs. Comments only on their own line.
; Block mode: any [[[ ]]] header present -> [Sections] outside blocks are ignored,
; [Settings] exeName is ignored.
; Structure: [[[Prepend]]] (optional, first) -> [[[exe, exe2]]] / [[[Default]]] blocks
;            -> [[Flag]] sub-blocks (first true flag wins; inherit from block base)
; Inheritance: key=value sections per key (blank overrides with blank),
;              [CustomAutoexecute]/[CustomSubroutine] per section (empty section disables).
; Base sections must come BEFORE the block's first [[Flag]].
; ============================================================================

[[[Prepend]]]
; only [CustomAutoexecute] / [CustomSubroutine] allowed; active in every block, never overridden
[CustomAutoexecute]
; runs once, assume-global. Initialise flags here (assignments in [CustomSubroutine] never run)
TestFlag := false
MenuMode := false
[CustomSubroutine]
^F1::MenuMode := !MenuMode
^F2::TestFlag := !TestFlag

; ============================================================================
; Block 1: single exe - reference for every setting
; ============================================================================
[[[Retroarch.exe]]]
[AnalogBinds]
; Wooting analog: axis=key:multiplier,key:multiplier. Negative multiplier = other direction. $ = suppress (AHI)
LX_A=d:1.0,a:-1.0
LY_A=w:1.0,s:-1.0
RX_A=
RY_A=
LT_A=$lshift:1.0
RT_A=$space:0.5
[DigitalBinds]
; digital key sets axis directly while held: key:value, range -100..100. $ = suppress (AHI)
LX_D=
LY_D=
RX_D=$left:-100,$right:100
RY_D=$up:100,$down:-100
LT_D=$q:100
RT_D=$lbutton:100
[DigitalButtons]
; comma separated lists, $ = suppress (AHI). Mouse: lbutton rbutton mbutton xbutton1 xbutton2
DPadUp=$W
DPadDown=$S
DPadLeft=$A
DPadRight=$D
A=$space,$enter
B=rbutton
X=$pgdn
Y=$pgup
LB=$f1
LS=$f2
RB=$f3
RS=$f4
Start=$e
Back=$q
Xbox=$f5
[Settings]
; exeName is only used without [[[ ]]] headers. Comma list allowed there.
; locks mouse inside window (ignored in [[[Default]]])
EnableMouseLock=1
; crosshair replaces the system cursor
EnableCursorReplacement=0
; vertical line follows cursor X
EnableVerticalLine=0
; start with mouse steering on (also toggleable via hotkeys / ahiS handlers)
StartupMouseSteering=0
; axis[,multiplier]; None = unused. Negative multiplier inverts
MouseSteeringAxisX=LX,1.0
MouseSteeringAxisY=None
; steer box relative to screen height, 1.0 = square
MouseSteerWidth=1.0
; 0-100 percent of the steer box
MouseSteerDeadzone=0
; digital LX_D moves the mouse to the matching position
LX_D_MovesMouse=0
; 0 = analog adds to mouse steer, 1 = analog overrides when non-zero
AnalogSupersedesMouse=0
; 0-255
WootingDeadzone=8
ExtStickDeadzone=8
ExtTriggerDeadzone=8
; 0-100. Sticks: radial only if both axes of a stick have identical antideadzone AND linearity
LX_Antideadzone=0
LY_Antideadzone=0
RX_Antideadzone=0
RY_Antideadzone=0
LT_Antideadzone=0
RT_Antideadzone=0
; 0.0001-0.9999, 0.5 = linear, below = flatter center, above = more sensitive center
LX_Linearity=0.5
LY_Linearity=0.5
RX_Linearity=0.5
RY_Linearity=0.5
LT_Linearity=0.5
RT_Linearity=0.5
; 0-100, percent of travel (from the top) that already counts as full deflection
LX_OuterDeadzone=0
LY_OuterDeadzone=0
RX_OuterDeadzone=0
RY_OuterDeadzone=0
LT_OuterDeadzone=0
RT_OuterDeadzone=0
; mouse translation (mouse movement -> stick), requires AHI. Blank axes = just suppress mouse movement
StartupMouseTranslation=0
MouseTranslationAxisX=RX,1.0
MouseTranslationAxisY=RY,-1.0
MouseTranslationSensitivity=6.66
; 0.01 to 0.999
MouseTranslationDecay=0.999
; === !!! Not ini format, must be placed at bottom of the block base (before first [[Flag]]) ===
[CustomAutoexecute]
; runs once on first activation, assume-global function. Use the Hotkey command, not hotkey labels
Hotkey, IfWinActive, ahk_group ActiveGameGroup
Hotkey, $F8, % Func("RA_ToggleSteer")
Hotkey, IfWinActive
RA_Counter := 0
[CustomSubroutine]
; --- normal AHK hotkeys, scoped to this block ---
#If (WinActive("ahk_group ActiveGameGroup"))
*w::
*a::
*s::
*d::
	Return
*1::f11 ; menu
*2::f12 ; quick save
!2::[ ; quick load
!r::] ; reset
*lctrl::f10
*f::f9
; built-in functions
*F6::ActivateMouseSteering()
*+F6::DeactivateMouseSteering()
*F7::ActivateMouseTranslation()
*+F7::DeactivateMouseTranslation()
*Pause::
	if (ControllerActive)
		DeactivateController()
	else
		ActivateController()
Return
; this block's own exes: WinActive("ahk_group " ActiveGameGroupName)
#If (WinActive("ahk_group " ActiveGameGroupName))
*F9::SoundBeep, 750, 100
#If

; --- AHI handlers: ahiS_<Key> fires on press (state 1) and release (state 0), key is suppressed ---
; blank = swallow the key
ahiS_F10::
; hold = mouse steering on, release = off
ahiS_Tab:: MouseSteering
; hold = mouse translation on
ahiS_XButton1:: MouseTranslation
; hold = controller output on, release = off
ahiS_XButton2:: ProcessController
; remap: holds the target key while held
ahiS_CapsLock:: Escape
; wheel shorthand: up key, down key, hold ms (default 25)
ahiS_Wheel:: Up,Down,50
; full form for custom logic (wheel direction is 1 or -1)
ahiS_HWheel(direction) {
	global RA_Counter
	RA_Counter += direction
}
; full form for keys (state is 1 or 0)
ahiS_G(state) {
	if (state)
		Send, {Enter}
}
RA_ToggleSteer() {
	global SteerKey
	SteerKey.Down := !SteerKey.Down
}

; --- [[Flag]] sub-blocks: first true flag wins, inherit everything not overridden ---
[[MenuMode]]
[DigitalButtons]
DPadUp=$up
DPadDown=$down
DPadLeft=$left
DPadRight=$right
A=$enter
B=$backspace
[AnalogBinds]
; present but blank = override with nothing
LX_A=
LY_A=
[Settings]
EnableMouseLock=0

[[TestFlag]]
[Settings]
LX_Antideadzone=20
LY_Antideadzone=20
LX_Linearity=0.35
LY_Linearity=0.35
RT_OuterDeadzone=10
[CustomSubroutine]
; present but empty = disables the inherited [CustomSubroutine] (Prepend stays active)

; ============================================================================
; Block 2: multiple exes - mouse steering preset
; ============================================================================
[[[RacingGame.exe, RacingGame_x64.exe]]]
[AnalogBinds]
LT_A=$lshift:1.0
RT_A=$space:1.0
[DigitalBinds]
LX_D=$a:-100,$d:100
[DigitalButtons]
A=$e
B=$q
Start=$esc
[Settings]
EnableMouseLock=1
EnableCursorReplacement=1
EnableVerticalLine=1
StartupMouseSteering=1
MouseSteeringAxisX=LX,1.0
MouseSteeringAxisY=None
MouseSteerWidth=0.6
MouseSteerDeadzone=5
LX_D_MovesMouse=1
AnalogSupersedesMouse=1
LX_Linearity=0.5
LY_Linearity=0.5
LX_OuterDeadzone=10
[CustomAutoexecute]
[CustomSubroutine]
ahiS_RButton:: MouseSteering

; ============================================================================
; Block 3: Default - active when no [[[exe]]] block matches, no exe detection, no mouse lock
; ============================================================================
[[[Default]]]
[DigitalButtons]
A=$space
B=$lctrl
DPadUp=$up
DPadDown=$down
DPadLeft=$left
DPadRight=$right
[Settings]
StartupMouseTranslation=1
MouseTranslationAxisX=RX
MouseTranslationAxisY=RY
MouseTranslationSensitivity=10
MouseTranslationDecay=0.9